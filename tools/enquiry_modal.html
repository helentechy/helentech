
<button type="button" class="enq-fab" data-open-enquiry data-enquiry-type="Ask a Question" aria-haspopup="dialog" aria-controls="enquiry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1.1-4.6A8 8 0 1121 12z"/></svg><span>Have a Question?</span></button>
<div class="enq" id="enquiry" hidden>
  <div class="enq-backdrop" data-enq-close></div>
  <div class="enq-dialog" role="dialog" aria-modal="true" aria-labelledby="enq-title" aria-describedby="enq-sub" tabindex="-1">
    <button type="button" class="enq-x" data-enq-close aria-label="Close enquiry form"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="enq-scroll">
      <div class="enq-form-view">
        <div class="enq-head">
          <span class="enq-eyebrow">Get in touch</span>
          <h2 id="enq-title">How can we help?</h2>
          <p id="enq-sub">Tell us what you need and we will reply to you by email.</p>
        </div>
        <form id="enqForm" novalidate>
          <div class="enq-alert" id="enqAlert" role="alert" hidden></div>
          <div class="enq-grid">
            <div class="enq-field"><label for="enq-name">Full name <span class="enq-req" aria-hidden="true">*</span></label><input id="enq-name" name="name" type="text" autocomplete="name" required aria-describedby="enq-name-err"><p class="enq-err" id="enq-name-err" hidden></p></div>
            <div class="enq-field"><label for="enq-email">Email address <span class="enq-req" aria-hidden="true">*</span></label><input id="enq-email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="enq-email-err"><p class="enq-err" id="enq-email-err" hidden></p></div>
            <div class="enq-field"><label for="enq-phone">Phone or WhatsApp <span class="enq-opt">(optional)</span></label><input id="enq-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+234 901 234 5678" aria-describedby="enq-phone-err"><p class="enq-err" id="enq-phone-err" hidden></p></div>
            <div class="enq-field"><label for="enq-company">Business name <span class="enq-opt">(optional)</span></label><input id="enq-company" name="company" type="text" autocomplete="organization"></div>
            <div class="enq-field"><label for="enq-service">Service interested in <span class="enq-opt">(optional)</span></label><select id="enq-service" name="service"><option value="">Select a service</option><option value="Google Business Profile Optimization">Google Business Profile Optimization</option><option value="Google Merchant Center Setup &amp; Suspension Fixes">Google Merchant Center Setup &amp; Suspension Fixes</option><option value="Google Ads &amp; Analytics">Google Ads &amp; Analytics</option><option value="Other Services">Other Services</option></select></div>
            <div class="enq-field"><label for="enq-type">Enquiry type</label><select id="enq-type" name="enquiryType"><option value="Request a Quote">Request a Quote</option><option value="Ask a Question">Ask a Question</option><option value="Request a Website Audit">Request a Website Audit</option><option value="Discuss a Project">Discuss a Project</option><option value="General Enquiry" selected>General Enquiry</option></select></div>
            <div class="enq-field enq-span"><label for="enq-budget">Budget <span class="enq-opt">(optional)</span></label><select id="enq-budget" name="budget"><option value="">Select a range</option><option value="Under $1,000">Under $1,000</option><option value="$1,000 to $3,000">$1,000 to $3,000</option><option value="$3,000 to $7,000">$3,000 to $7,000</option><option value="$7,000 or more">$7,000 or more</option><option value="Not sure yet">Not sure yet</option></select></div>
            <div class="enq-field enq-span"><label for="enq-message">Message <span class="enq-req" aria-hidden="true">*</span></label><textarea id="enq-message" name="message" rows="3" required placeholder="Tell us what you need help with." aria-describedby="enq-message-err"></textarea><p class="enq-err" id="enq-message-err" hidden></p></div>
          </div>
          <div class="enq-hp" aria-hidden="true"><label>Leave this field empty<input type="text" name="botcheck" tabindex="-1" autocomplete="off"></label></div>
          <button type="submit" class="btn btn-primary enq-submit" id="enqSubmit"><span class="enq-submit-label">Send My Enquiry</span></button>
          <p class="enq-privacy">Your information will only be used to respond to your enquiry.</p>
        </form>
        <div class="enq-alt" role="group" aria-label="Other ways to contact HelenTech"><span>Prefer to message us directly?</span><a href="mailto:@@EMAIL@@" data-enq-email>Email</a><a href="https://wa.me/@@WA@@" target="_blank" rel="noopener" data-enq-wa>WhatsApp</a></div>
      </div>
      <div class="enq-success" id="enqSuccess" role="status" tabindex="-1" hidden>
        <span class="enq-success-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <h2>Thank you, <span data-enq-first>there</span>.</h2>
        <p>We have received your enquiry and will reply to <strong data-enq-sent-to>your email</strong>.</p>
        <button type="button" class="btn btn-primary" data-enq-close>Close</button>
      </div>
    </div>
  </div>
</div>
<script src="assets/js/enquiry.js" defer></script>
